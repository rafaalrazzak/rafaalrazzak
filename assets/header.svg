<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0d17"/>
      <stop offset="100%" stop-color="#12142a"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="280" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#dots)"/>

    <g transform="translate(170,140)">
      <circle r="64" fill="none" stroke="url(#mark)" stroke-width="3" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" values="1;0" dur="1.1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </circle>

      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" begin="2.4s" repeatCount="indefinite"/>
        <polygon points="0,-50 50,0 0,50 -50,0" fill="none" stroke="url(#mark)" stroke-width="3" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
          <animate attributeName="stroke-dashoffset" values="1;0" dur="1.1s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
        </polygon>
      </g>

      <g stroke="url(#mark)" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.7s" fill="freeze"/>
        <line x1="0" y1="-68" x2="0" y2="-80"/>
        <line x1="0" y1="68" x2="0" y2="80"/>
        <line x1="-68" y1="0" x2="-80" y2="0"/>
        <line x1="68" y1="0" x2="80" y2="0"/>
      </g>
    </g>

    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="360" y="125" font-size="46" font-weight="700" fill="url(#nameGrad)" opacity="0">
        RAFA AL RAZZAK
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.25;1" dur="1.4s" begin="0.3s" fill="freeze"/>
      </text>
      <text x="360" y="160" font-size="19" fill="#c7c9e0" opacity="0">
        Design &amp; Full-stack Engineer
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.25;1" dur="1.4s" begin="0.9s" fill="freeze"/>
      </text>
      <text x="360" y="188" font-size="14" fill="#8b8fb3" opacity="0">
        Bogor, Indonesia · TypeScript · React · Go
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.25;1" dur="1.4s" begin="1.3s" fill="freeze"/>
      </text>
    </g>
  </g>
</svg>
